# Real car, Levine: BNN SIT-LMPC with chance constraints (boundary 0.05, hull 0.9, conservative fallback).
extends: car-levine-bnn-nochance.yaml
output:
  exp_name: car-levine-bnn
planner:
  probabilistic_safety:
    enabled: true
    boundary_threshold: 0.05
    terminal_hull_threshold: 0.9
    lambda_count: 10
    lambda_max: 20.0
    max_candidates: 256
    fallback: baseline
