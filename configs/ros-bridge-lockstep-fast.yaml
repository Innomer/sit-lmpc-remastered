# f1tenth_gym_ros bridge parameters for fast SIT-LMPC lockstep runs: 10 physics steps (0.1 s) per drive message.
# ros2 run f1tenth_gym_ros gym_bridge --ros-args -r __node:=bridge --params-file configs/ros-bridge-lockstep-fast.yaml
bridge:
  ros__parameters:
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'
    lidar_enabled: False
    lidar_base_link_to_lidar_tf: [0.275, 0.0, 0.0]
    lidar_noise_std: 0.01
    scan_num_beams: 819
    scan_range_min: 0.05
    scan_range_max: 25.0
    scan_angle_min: -135.0
    scan_angle_max: 135.0
    map_path: 'maps/Spielberg'
    map_img_ext: '.png'
    vehicle_params: 'f1tenth'
    scale: 1.0
    num_agents: 1
    sx: 0.0
    sy: 0.0
    stheta: -2.879
    kb_teleop: False
    use_sim_time: False
    use_sim_time_bridge: True
    async_mode: False
    control_mode: 'accel_steering_speed'
    substeps_per_drive: 10
