# rssm-v10: fine-tune of rssm-v8 on the open-space coverage data (scripts/collect_coverage.py) mixed 50/50 with the
# cleaned on-track data (post-contact frames removed, spin onsets included). LiDAR losses only on the track windows.
# Position residual in the car frame (body_frame_residual). No map-free data, no bad-batch skip.
dataset: data/f1tenth-track
vehicle_config: configs/world/world-nochance.yaml
timestep: 0.1
integrator_timestep: 0.02
seed: 20261126
model:
  hidden: 128
  condition: 8
  fast: 24
  beams: 64
  sensors: 9
  body_frame_residual: true
steps: 12000
batch: 32
window: 40
learning_rate: 0.00005
clip: 1.0
skip_factor: 1.0e+12
stop_factor: 3.0
stop_patience: 3
kl_warmup: 1
eval_every: 500
val_batches: 8
diagnostic_window: 80
comparison_every: 2500
settings:
  condition_walk_std: 0.05
  free_nats: 1.0
  prediction_steps: 15
  prediction_stride: 2
  anchor_weights: [1.0, 3.0, 1.0, 1.0]
weights:
  anchor: 1.0
  residual: 1.0
  lidar: 1.0
  sensors: 1.0
  kl: 1.0
  condition: 3.0
  prediction: 1.0
  true_state_prediction: 1.0
  prediction_lidar: 0.5
  consistency: 0.5
selection: [anchor, residual, prediction, true_state_prediction, lidar]
data_cut: [1.2, 10.0]
high_slip_fraction: 0.15
high_slip_threshold: 0.4
init_from: runs/rssm-v8
coverage_dataset: data/f1tenth-coverage
coverage_fraction: 0.5
