# Dry run of configs/car/levine-bicycle.yaml on the ROS sim (car backend, real time, same code path as on the car) on the
# Levine sim map. Bridge: configs/car/ros-bridge-dryrun-levine.yaml. Start the run, then press go:
#   ros2 topic pub --once /sit_lmpc/go std_msgs/msg/Empty
extends: levine-bicycle.yaml
output:
  exp_name: car-dryrun-levine-bicycle
simulation:
  map: tracks/levine_sim/levine_sim
  steering_limit: null  # the sim car's own limit (0.42 rad): the Levine sim centreline has 0.9 m corners, tighter than the real car's 0.34 rad allows (0.93 m), so the warm-up profile would stop there
  max_laps: 8
  ros:
    actuation_delay: 0.0  # the sim bridge has no actuation delay; the car configs compensate the real 0.2 s
  car:
    odom_topic: /ego_racecar/pf_odom
    speed_topic: /ego_racecar/wheel_odom
    imu_topic: /ego_racecar/imu
    scan_topic: /scan
    joy_topic: ""
    start_zone: 4.0
    bag_topics: [/ego_racecar/pf_odom, /ego_racecar/wheel_odom, /ego_racecar/imu, /scan, /drive]
planner:
  half_width: 0.57
  warmup:
    path: tracks/levine_sim/levine_sim_centerline.csv
