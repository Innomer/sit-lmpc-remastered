# Retry mode: bicycle + the hand-written speed reaction (entry 41 settings). Cap raising uses the bicycle's own
# 1.0 s error (the same signal as the change tag) against its pre-change error-vs-speed fit.
extends: ../fast-diag/known-varied-warmup.yaml
output:
  exp_name: retry-bicycle-react
planner:
  sit_lmpc_mode: false
  change_detection: true
  change_window: 10
  change_ratio: 3.0
  change_floor: 0.05
  change_new_laps: 2
  change_conservative_laps: 2
  change_value: true
  change_speed: fixed
  change_speed_factor: 0.8
  change_cap_scope: evidence
  change_cap_strong_weight: 0.1
  change_cap_soft_weight: 0.03
  change_cap_rank_weight: 1000.0
  change_brake_candidates: 4
  change_raise_step: 0.3
  change_min_clearance: 0.2
  change_pass_share: 0.9
